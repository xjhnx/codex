<style amp-boilerplate>
  body{-webkit-animation:-amp-start 8s steps(1,end) 0s 1 normal both;-moz-animation:-amp-start 8s steps(1,end) 0s 1 normal both;-ms-animation:-amp-start 8s steps(1,end) 0s 1 normal both;animation:-amp-start 8s steps(1,end) 0s 1 normal both}
  @-webkit-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}
  @-moz-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}
  @-ms-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}

<style amp-custom>

    /* ── ROOT VARIABLES ── */
    :root {
      --gold:       #FFFFFF;
      --gold-dim:   #FFFFFF;
      --yellow:     #FFFFFF;
      --yellow-dim: #E6E6E6;
      --dark:       #000000;
      --dark-card:  #000000;
      --border:     rgba(255, 255, 255, 0.55);
      --text:       #FFFFFF;
      --text-dim:   #FFFFFF;
    }
  
    /* ── RESET ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
    body {
      font-family: 'Rajdhani', sans-serif;
      background: var(--dark);
      min-height: 100vh;
      overflow-x: hidden;
      color: #FFFFFF;
    }
  
    /* ── HERO BACKGROUND ── */
    .hero-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: var(--dark); /* Memastikan background dasar hitam total */
    }
  
    .hero-bg amp-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.15) grayscale(0.8); /* Dibuat sangat gelap dan minim warna lain */
    }
  
    /* ── GRID SCANLINES ── */
    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 1;
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 3px,
          rgba(7, 7, 7, 0.04) 3px,
          rgba(7, 7, 7, 0.04) 4px
        );
      pointer-events: none;
    }
  
    /* ── OVERLAY / CENTER ── */
    .overlay {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }
  
    /* ── CARD ── */
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--dark-card);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.10);
    }
  
    /* ── TOPBAR ── */
    .topbar {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
  
    .topbar img {
      height: 60px;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.20));
    }
  
    /* ── BANNER ── */
    .banner {
      position: relative;
      overflow: hidden;
    }
  
    .banner img {
      width: 100%;
      display: block;
    }
  
    /* ── ANAKSEO ── */
    .ANAKSEO {
      padding: 11px 16px;
      text-align: center;
      font-family: 'Orbitron', monospace; 
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: var(--gold);
      text-transform: uppercase;
      background: #000000;
      border-bottom: 1px solid var(--border);
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.55);
    }
  
    /* ── CONTENT ── */
    .content {
      padding: 16px;
    }
  
    /* ── BUTTONS ── */
    .btns {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
  
    .btn {
      flex: 1;
      height: 46px;
      line-height: 44px;
      text-align: center;
      text-decoration: none;
      font-family: 'Orbitron', monospace;
      font-weight: 800;
      border-radius: 8px;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: all 0.2s ease;
      color: #FFFFFF;
    }
  
    /* Tombol Daftar - Hitam dengan teks putih */
    .btn-daftar {
      background: #000000;
      color: #FFFFFF;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.28);
      border: 2px solid #FFFFFF;
    }
  
    /* Tombol Login - Hitam dengan border putih */
    .btn-login {
      background: #000000;
      border: 2px solid #FFFFFF;
      color: #FFFFFF;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.18);
    }
  
    /* ── INFO TABLE ── */
    .info {
      background: #000000;
      border-radius: 10px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
  
    .row {
      display: flex;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.20);
    }
  
    .row:last-child {
      border-bottom: none;
    }
  
    .label {
      width: 45%;
      color: var(--gold-dim);
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
  
    .value {
      width: 55%;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
    }
  
    /* ── STATS BADGES ── */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
  
    .stat-badge {
      background: #000000;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
  
    .stat-label {
      font-family: 'Orbitron', monospace;
      font-size: 9px;
      color: var(--text-dim);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  
    .stat-value {
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      font-weight: 700;
      color: var(--gold);
    }
  
    /* ── FOOTER ── */
    .footer {
      margin-top: 14px;
      text-align: center;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-family: 'Orbitron', monospace;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.28);
    }
  
    .footer span {
      color: var(--gold);
    }

    .copyright a {
  color: #FFFFFF;
  text-decoration: none;
}
  
  </style>
</head>

<body>

  <!-- Background image -->
  <div class="hero-bg">
    <amp-img
      src="##BANNER##"
      layout="fill"
      object-fit="cover"
      alt="##KW## Background">

  </div>

  <!-- Scanlines texture -->
  <div class="scanlines"></div>

  <!-- Main overlay -->
  <div class="overlay">
    <div class="card">

      <!-- Top logo bar -->
      <div class="topbar">
        <img src="##LOGO##" alt="##KW## Logo">
      </div>

      <!-- Banner image -->
      <div class="banner">
        <img src="##BANNER##" alt="##KW## Banner">
      </div>

      <!-- Title bar -->
      <div class="ANAKSEO">
        
        <div class="btns">
          <a href="##LINK DAFTAR##" class="btn btn-daftar">DAFTAR</a>
          <a href="##LINK DAFTAR##" class="btn btn-login">LOGIN</a>
        </div>
      
    
        <div class="stats-grid">
          <div class="stat-badge">
            <span class="stat-label">RATING</span>
            <span class="stat-value">⭐⭐⭐⭐⭐</span>
          </div>
          <div class="stat-badge">
            <span class="stat-label">DEPOSIT</span>
            <span class="stat-value">10 RIBU</span>
          </div>
          <div class="stat-badge">
            <span class="stat-label">WIN RATE</span>
            <span class="stat-value">98%</span>
          </div>
          <div class="stat-badge">
            <span class="stat-label">WITHDRAW</span>
            <span class="stat-value">50 RIBU</span>
          </div>
        </div>

        <!-- Footer -->
        <div class="footer">
           <p class="copyright">
         <strong>&copy;<a href="##CANONICAL##">##KW##</a> 2026 - ANAKSEO</strong>
            </p>
        </div>

      </div>
    
    </div>
  </div>
</body>
</html>
